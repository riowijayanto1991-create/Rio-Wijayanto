    <script>
      // Suppress harmless Vite dev WebSocket closed error in iframe proxy environment where HMR is disabled
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (!OriginalWebSocket) return;

        window.WebSocket = function(url, protocols) {
          const isViteHmr = 
            (typeof protocols === 'string' && protocols === 'vite-hmr') ||
            (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
            (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/client')));

          if (isViteHmr) {
            const listeners = {};
            const mockWs = {
              readyState: 1, // OPEN
              send: function() {},
              close: function() {},
              addEventListener: function(type, fn) {
                listeners[type] = listeners[type] || [];
                listeners[type].push(fn);
                if (type === 'open') {
                  setTimeout(() => {
                    try { fn({ type: 'open' }); } catch (err) {}
                  }, 0);
                }
              },
              removeEventListener: function(type, fn) {
                if (!listeners[type]) return;
                listeners[type] = listeners[type].filter(l => l !== fn);
              },
              dispatchEvent: function() { return true; },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
            };
            return mockWs;
          }

          return new OriginalWebSocket(url, protocols);
        };

        window.WebSocket.prototype = OriginalWebSocket.prototype;
        window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
        window.WebSocket.OPEN = OriginalWebSocket.OPEN;
        window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
        window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('ws://') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && typeof e.reason.message === 'string' && (e.reason.message.indexOf('WebSocket') !== -1 || e.reason.message.indexOf('ws://') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>

    <script>
      (function() {
        try {
          // Check version to bust stale browser cache automatically
          var CURRENT_APP_VERSION = '2025.10.27-wsr-v2';
          var storedVer = localStorage.getItem('whu_app_bundle_ver');
          if (storedVer !== CURRENT_APP_VERSION) {
            localStorage.setItem('whu_app_bundle_ver', CURRENT_APP_VERSION);
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(reg) { reg.unregister(); });
              });
            }
          }

          // Hapus preferensi tema lama sepenuhnya agar tema cerah aktif murni
          localStorage.removeItem('whu_theme_mode');
          var themeV2 = localStorage.getItem('whu_theme_mode_v2');
          if (themeV2 === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
